{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h2 class="mb-4 text-center fw-bold">Entrar no MedLembrete</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">E-mail</label>
                    <input type="email" name="email" class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Palavra-passe</label>
                    <input type="password" name="senha" class="form-control form-control-lg" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg-custom mb-3">Entrar</button>
            </form>
            <a href="{{ url_for('cadastro') }}" class="btn btn-outline-secondary w-100 btn-lg">Criar Nova Conta</a>
        </div>
    </div>
</div>
{% endblock %}
